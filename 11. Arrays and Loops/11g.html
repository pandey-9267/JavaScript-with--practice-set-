<!DOCTYPE html>

<head>
    <title>Document</title>
</head>

<body>
    <script>
        const array = [1, 2, 3];
        const result = [];
        for (let i = 0; i < array.length; i++) {
            result.push(array[i] + 1);
        }
        console.log(array);         // the original array

        console.log(result);           // the updated array
    </script>
</body>

</html>
