<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .toggle-btn {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            margin-right: 10px;
            font-size: 15px;
            cursor: pointer;
        }


        .is-toggle {
            background-color: rgb(230, 230, 230);
            color: black;
        }
    </style>
</head>

<body>
    <button class="toggle-btn js-btn" onclick="
       toggled_btn('.js-btn');
        ">Gaming</button>

    <button class="toggle-btn  js-btn1" onclick="
     toggled_btn('.js-btn1');
        ">Music</button>

    <button class="toggle-btn js-btn2" onclick="
       toggled_btn('.js-btn2');
        ">Tech</button>
    <script>


//  in this ( ) brakets you can write any thing just remember that also same in queryselector 

        function toggled_btn(alpha) {
            const btns = document.querySelector(alpha);
            btns.classList.toggle('is-toggle');
        }
    </script>

</body>

</html>
