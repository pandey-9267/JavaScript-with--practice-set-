<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to check the iten in html contains the class or not</title>
</head>
<body>
    <button class="js-btn">Test</button>
    
    <script>
        const btn = document.querySelector('.js-btn');
        console.log(btn.classList.contains('js-btn'));
       
    </script>
</body>
</html>
