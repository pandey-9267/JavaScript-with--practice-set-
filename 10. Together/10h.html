<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Calculator</title>
    <style>
        body {
            font-family: Arial;
        }

        .cost-input {
            padding: 10px;
            font-size: 15px
        }

        .calculate-btn {
            background-color: green;
            border: none;
            color: white;
            padding: 12px 15px;
            font-size: 15px;
            cursor: pointer;
        }

        
        .error-message {
            color: red;
        }
    </style>

</head>

<body>

    <p>Amazon Shipping Calculator</p>

    <input placeholder="Cost of order" class="cost-input js-cost-input" onkeydown="
    onkeydownInput(event);
    ">

    <button class="calculate-btn" onclick="
    calculateTotal();
    ">Calculate</button>

    <p class="js-total-cost total-cost"></p>

    <p class="error-message js-error-message"></p>

    <script>

        function onkeydownInput(event) {
            if (event.key === 'Enter') {
                calculateTotal();
            }
        }

        function calculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);

            // First, reset all the previous Messages
            document.querySelector('.js-total-cost')
                .innerHTML = '';
            document.querySelector('.js-error-message')
                .innerHTML = '';


            if (cost <= 0) {
                document.querySelector('.js-error-message')
                    .innerHTML = `Error: Cost must be more than 0`

                // If we display an error, we can use return to
                // end this function immediately. This is called
                // an "early return" and it makes the code cleaner
                // because it reduces nesting / indents.

                return;
            }

            if (cost < 50) {
                cost = cost + 10;
            }

            document.querySelector('.js-total-cost')
                .innerHTML = `Your total bill: $${cost}`

        }
    </script>
</body>

</html>
