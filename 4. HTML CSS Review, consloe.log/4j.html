<!DOCTYPE html>

<head>
<title>Buttons</title>
  <style>
    .add-to-cart {
      background-color: yellow;
    }

    .buy-now {
      background-color: orange;
    }
  </style>
</head>

<body>
<p>Adults Plain Cotton T-shirt</p>
<p>Price: $7.99</p>
  <button class="add-to-cart" onclick="alert('Added')">Add to cart</button>
  <button onclick="console.log('Loading...'); alert('Purchased');" class="buy-now">Buy now</button>
 
</body>

</html>
