<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>use of parameter in function</title>
</head>

<body>
    <script>
        function greet(name) {
            console.log(`Hello ${name}`);
        }
        greet('Abhishek');
        greet('Anush');
        greet('Rakesh');

    </script>
</body>

</html>
